<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GRSVC1 Control</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Source Sans Pro", -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f3f3f3;
            min-height: 100vh;
            color: #434343;
            font-size: 10px;
            padding: 7px;
        }

        .header {
            text-align: center;
            color: #333333;
            margin-bottom: 10px;
        }

        .header h1 {
            font-size: 1.0em;
            margin-bottom: 3px;
            color: #333333;
        }

        .card {
            background: #fff;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 7px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card h2 {
            color: #333333;
            margin-bottom: 7px;
            font-size: 0.8em;
            font-weight: 600;
        }

        .connection-status {
            text-align: center;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            font-weight: bold;
            font-size: 0.9em;
        }

        .status-disconnected {
            background: #fef2f2;
            color: #333333;
            border: 1px solid #572121;
        }

        .status-connected {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #3da862;
        }

        .btn {
            background: #333333;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            width: 100%;
            margin: 5px 0;
            text-align: center;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.6;
        }

        .btn:hover {
            background: #2c2d33;
        }

        .btn-danger {
            background: #dc3545;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .toggle-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            font-weight: 600;
            width: 100%;
            margin: 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .toggle-btn.on {
            background: #28a745;
        }

        .toggle-btn.off {
            background: #333333;
        }

        .sensor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .sensor-item {
            background: rgba(0,0,0,0.025);
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .sensor-value {
            font-size: 1.1em;
            font-weight: bold;
            color: #2c2d33;
            margin-bottom: 3px;
        }

        .sensor-label {
            font-size: 0.8em;
            color: #737781;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-title {
            font-weight: 600;
            color: #2c2d33;
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .file-input-container {
            margin: 10px 0;
        }

        .file-input {
            position: absolute;
            left: -9999px;
            opacity: 0;
        }

        .file-label {
            display: block;
            padding: 12px;
            background: #43454b;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .file-label:hover {
            background: #2c2d33;
        }

        .file-info {
            background: rgba(0,0,0,0.025);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.8em;
            margin-bottom: 10px;
            border: 1px solid rgba(0,0,0,0.05);
        }

        .progress-container {
            margin: 10px 0;
        }

        .progress-bar {
            width: 100%;
            height: 16px;
            background: rgba(0,0,0,0.1);
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #28a745, #20c997);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            font-weight: bold;
            color: #2c2d33;
            font-size: 0.9em;
        }

        .log-container {
            background: #2c2d33;
            color: #9aa0a7;
            padding: 10px;
            border-radius: 6px;
            font-family: "Courier 10 Pitch", Courier, monospace;
            font-size: 0.7em;
            max-height: 150px;
            overflow-y: auto;
            border: 1px solid rgba(0,0,0,0.1);
        }

        .log-entry {
            margin-bottom: 2px;
            line-height: 1.2;
        }

        .log-entry.error {
            color: #ff6b6b;
        }

        .log-entry.warning {
            color: #ffc107;
        }

        .log-entry.info {
            color: #17a2b8;
        }

        .log-entry.success {
            color: #28a745;
        }

        .hidden {
            display: none;
        }

        .nav-back {
            color: #333333;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            transition: background 0.2s ease;
            font-size: 0.9em;
        }

        .nav-back:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        .nav-back {
            color: #333333;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.05);
            border-radius: 6px;
            transition: background 0.2s ease;
            font-size: 0.9em;
        }

        .nav-back:hover {
            background: rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 360px) {
            .sensor-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="nav-back">← Back to Main Menu</a>
    
    <div class="header">
        <h1>GRSVC1 BLE Control</h1>
    </div>

    <!-- Connection -->
    <div class="card">
        <button id="connectBtn" class="btn">Connect</button>
        <button id="disconnectBtn" class="btn btn-danger hidden">Disconnect</button>
        <button id="scanBtn" class="btn" style="background: #17a2b8;">Scan for Devices</button>
    </div>

    <!-- Status -->
    <div class="card hidden" id="statusCard">
        <h2>Status</h2>
        <div class="sensor-grid">
            <div class="sensor-item">
                <div class="sensor-value" id="batteryLevel">-</div>
                <div class="sensor-label">Battery</div>
            </div>
            <div class="sensor-item">
                <div class="sensor-value" id="temperature">-</div>
                <div class="sensor-label">Temperature</div>
            </div>
            <div class="sensor-item">
                <div class="sensor-value" id="humidity">-</div>
                <div class="sensor-label">Humidity</div>
            </div>
            <div class="sensor-item">
                <div class="sensor-value" id="flowRate">-</div>
                <div class="sensor-label">Flow Rate</div>
            </div>
            <div class="sensor-item">
                <div class="sensor-value" id="macAddress" style="font-size: 0.8em;">-</div>
                <div class="sensor-label">Device Name</div>
            </div>
            <div class="sensor-item">
                <div class="sensor-value" id="firmwareVersion" style="font-size: 0.8em;">-</div>
                <div class="sensor-label">Firmware Version</div>
            </div>
        </div>
        <button class="btn" onclick="refreshSensors()">Refresh</button>
    </div>

    <!-- Controls -->
    <div class="card hidden" id="controlsCard">
        <h2>Controls</h2>
        
        <div class="control-group">
            <div class="control-title">Valve 1</div>
            <button class="toggle-btn off" id="valve1Btn" onclick="toggleControl('valve1', 'VALVE 1')">
                <span id="valve1Icon">🔒</span>
                <span id="valve1Text">OFF</span>
            </button>
        </div>
        
        <div class="control-group">
            <div class="control-title">Valve 2</div>
            <button class="toggle-btn off" id="valve2Btn" onclick="toggleControl('valve2', 'VALVE 2')">
                <span id="valve2Icon">🔒</span>
                <span id="valve2Text">OFF</span>
            </button>
        </div>
    </div>

    <!-- Firmware Update -->
    <div class="card hidden" id="firmwareCard">
        <h2>Firmware Update</h2>
        <div style="padding: 10px; background: rgba(40, 167, 69, 0.1); border-radius: 6px; border: 1px solid #28a745; margin-bottom: 15px;">
            <strong>OTA Ready:</strong> Over-the-air firmware updates are now supported via BLE.
        </div>
        
        <div class="file-input-container">
            <input type="file" id="firmwareFile" class="file-input" accept=".bin" onchange="handleFileSelect(event)">
            <label for="firmwareFile" class="file-label">
                📁 Choose Firmware File (.bin)
            </label>
        </div>
        
        <div id="fileInfo" class="file-info hidden"></div>
        
        <div id="otaProgress" class="progress-container hidden">
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
                <div id="progressText" class="progress-text">0%</div>
            </div>
        </div>
        
        <button id="updateBtn" class="btn" onclick="startFirmwareUpdate()" disabled>
            🚀 Start Update
        </button>
    </div>

    <!-- Log -->
    <div class="card">
        <h2>Log</h2>
        <div id="logContainer" class="log-container">
            <div class="log-entry info">Ready to connect</div>
        </div>
    </div>

    <script>
        // BLE variables
        let device = null;
        let server = null;
        let batteryService = null;
        let environmentalService = null;
        let flowService = null;
        let valveService = null;
        let deviceInfoService = null;
        let otaService = null;
        
        // Characteristics
        let controlCharacteristic = null;
        let statusCharacteristic = null;
        let valve1Characteristic = null;
        let valve2Characteristic = null;
        let flowCharacteristic = null;
        let batteryCharacteristic = null;
        let temperatureCharacteristic = null;
        let humidityCharacteristic = null;
        let deviceNameCharacteristic = null;
        let firmwareVersionCharacteristic = null;
        let otaControlCharacteristic = null;
        let otaDataCharacteristic = null;
        
        let monitoringInterval = null;
        let connectionCheckInterval = null;
        let isReconnecting = false;
        let manualDisconnect = false;
        let selectedFile = null;
        let otaInProgress = false;

        // Service UUIDs - Web Bluetooth requires LOWERCASE UUIDs
        const BATTERY_SERVICE_UUID = '0000180f-0000-1000-8000-00805f9b34fb';      // Battery Service (0x180F)
        const ENVIRONMENTAL_SERVICE_UUID = '0000181a-0000-1000-8000-00805f9b34fb'; // Environmental Service (0x181A)
        const FLOW_SERVICE_UUID = '12345678-1234-1234-1234-123456789abc';          // Custom Flow Service (lowercase for Web Bluetooth)
        const VALVE_SERVICE_UUID = '12345678-1234-1234-1234-123456789abe';         // Custom Valve Service (lowercase for Web Bluetooth)
        const DEVICE_INFO_SERVICE_UUID = '0000180a-0000-1000-8000-00805f9b34fb';   // Device Information Service (0x180A)
        const OTA_SERVICE_UUID = '12345678-1234-1234-1234-123456789ac3';           // Custom OTA Service (lowercase for Web Bluetooth)
        
        // Characteristic UUIDs - Web Bluetooth requires LOWERCASE UUIDs
        const BATTERY_CHARACTERISTIC_UUID = '00002a19-0000-1000-8000-00805f9b34fb';     // Battery Level (0x2A19)
        const TEMPERATURE_CHARACTERISTIC_UUID = '00002a6e-0000-1000-8000-00805f9b34fb'; // Temperature (0x2A6E)
        const HUMIDITY_CHARACTERISTIC_UUID = '00002a6f-0000-1000-8000-00805f9b34fb';    // Humidity (0x2A6F)
        const FLOW_CHARACTERISTIC_UUID = '12345678-1234-1234-1234-123456789abd';        // Flow Rate (custom, lowercase for Web Bluetooth)
        const VALVE1_CHARACTERISTIC_UUID = '12345678-1234-1234-1234-123456789abf';      // Valve 1 State (custom, lowercase for Web Bluetooth)
        const VALVE2_CHARACTERISTIC_UUID = '12345678-1234-1234-1234-123456789ac0';      // Valve 2 State (custom, lowercase for Web Bluetooth)
        const DEVICE_NAME_CHARACTERISTIC_UUID = '00002a00-0000-1000-8000-00805f9b34fb'; // Device Name (0x2A00)
        const FIRMWARE_VERSION_CHARACTERISTIC_UUID = '00002a26-0000-1000-8000-00805f9b34fb'; // Firmware Version (0x2A26)
        const OTA_CONTROL_CHARACTERISTIC_UUID = '12345678-1234-1234-1234-123456789ac1';  // OTA Control (custom, lowercase for Web Bluetooth)
        const OTA_DATA_CHARACTERISTIC_UUID = '12345678-1234-1234-1234-123456789ac2';     // OTA Data (custom, lowercase for Web Bluetooth)
        
        // Legacy support - keeping old variable names for compatibility
        const MAIN_SERVICE_UUID = VALVE_SERVICE_UUID;  // Use valve service as main service
        const CONTROL_CHARACTERISTIC_UUID = VALVE1_CHARACTERISTIC_UUID;

        // Control states
        let controlStates = {
            valve1: false,
            valve2: false
        };

        // Global monitoring function
        window.startMonitoring = function() {
            if (monitoringInterval) {
                clearInterval(monitoringInterval);
                monitoringInterval = null;
            }
            
            monitoringInterval = setInterval(async () => {
                // Check if page is hidden and skip monitoring to save battery
                if (document.hidden) {
                    return;
                }
                
                // Check if still connected before attempting reads
                if (!window.device || !window.device.gatt || !window.device.gatt.connected) {
                    return;
                }
                
                try {
                    // Battery
                    if (batteryCharacteristic) {
                        const batteryValue = await batteryCharacteristic.readValue();
                        const batteryLevel = batteryValue.getUint8(0);
                        document.getElementById('batteryLevel').textContent = `${batteryLevel}%`;
                    }

                    // Temperature
                    if (temperatureCharacteristic) {
                        const tempValue = await temperatureCharacteristic.readValue();
                        const temperature = tempValue.getInt16(0, true) / 100;
                        document.getElementById('temperature').textContent = `${temperature.toFixed(1)}°C`;
                    }

                    // Humidity
                    if (humidityCharacteristic) {
                        const humidityValue = await humidityCharacteristic.readValue();
                        const humidity = humidityValue.getUint16(0, true) / 100;
                        document.getElementById('humidity').textContent = `${humidity.toFixed(1)}%`;
                    }

                    // Flow Rate (reading uint32_t pulse count from firmware)
                    if (flowCharacteristic) {
                        const flowValue = await flowCharacteristic.readValue();
                        const pulseCount = flowValue.getUint32(0, true);
                        document.getElementById('flowRate').textContent = `${pulseCount} pulses`;
                    }

                    // Device Name (read only once, doesn't change)
                    if (deviceNameCharacteristic && (document.getElementById('macAddress').textContent === '-' || document.getElementById('macAddress').textContent === '')) {
                        const nameValue = await deviceNameCharacteristic.readValue();
                        const nameString = new TextDecoder().decode(nameValue);
                        document.getElementById('macAddress').textContent = nameString; // Using MAC field for device name
                    }

                    // Firmware Version (read only once, doesn't change)
                    if (firmwareVersionCharacteristic && (document.getElementById('firmwareVersion').textContent === '-' || document.getElementById('firmwareVersion').textContent === '')) {
                        const firmwareValue = await firmwareVersionCharacteristic.readValue();
                        const firmwareString = new TextDecoder().decode(firmwareValue);
                        document.getElementById('firmwareVersion').textContent = firmwareString;
                    }

                } catch (error) {
                    // If reads fail, the connection might be lost
                    if (!isReconnecting && !document.hidden) {
                        log('Sensor read failed, checking connection...', 'warning');
                    }
                }
            }, document.hidden ? 10000 : 5000); // Slower when hidden
        };

        // DOM elements
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const scanBtn = document.getElementById('scanBtn');
        const statusCard = document.getElementById('statusCard');
        const controlsCard = document.getElementById('controlsCard');
        const firmwareCard = document.getElementById('firmwareCard');
        const logContainer = document.getElementById('logContainer');

        // Event listeners
        connectBtn.addEventListener('click', connectToDevice);
        disconnectBtn.addEventListener('click', disconnectFromDevice);
        scanBtn.addEventListener('click', scanForDevices);

        // Logging
        function log(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${timestamp.slice(0, 5)}] ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
            
            // Keep only last 30 entries
            while (logContainer.children.length > 30) {
                logContainer.removeChild(logContainer.firstChild);
            }
        }

        // Connect to device
        async function connectToDevice() {
            if (isReconnecting) return;
            
            try {
                manualDisconnect = false; // Reset manual disconnect flag
                log('Requesting BLE device...');
                
                let device = null;
                
                // Try specific filters first
                try {
                    device = await navigator.bluetooth.requestDevice({
                        filters: [
                            { name: 'GRSVC1' },
                            { namePrefix: 'GRSVC' },
                            { services: [BATTERY_SERVICE_UUID] },
                            { services: [ENVIRONMENTAL_SERVICE_UUID] },
                            { services: [VALVE_SERVICE_UUID] }
                        ],
                        optionalServices: [
                            BATTERY_SERVICE_UUID,
                            ENVIRONMENTAL_SERVICE_UUID,
                            FLOW_SERVICE_UUID,
                            VALVE_SERVICE_UUID,
                            DEVICE_INFO_SERVICE_UUID,
                            OTA_SERVICE_UUID
                        ]
                    });
                    log(`✅ Found device: ${device.name || 'Unnamed'} (${device.id})`);
                } catch (filterError) {
                    log(`⚠️ Specific filters failed: ${filterError.message}`, 'warning');
                    log('🔍 Trying simplified filter with just battery service...', 'info');
                    
                    // Try with just battery service (more likely to work)
                    try {
                        device = await navigator.bluetooth.requestDevice({
                            filters: [{ services: [BATTERY_SERVICE_UUID] }],
                            optionalServices: [
                                BATTERY_SERVICE_UUID,
                                ENVIRONMENTAL_SERVICE_UUID,
                                FLOW_SERVICE_UUID,
                                VALVE_SERVICE_UUID,
                                DEVICE_INFO_SERVICE_UUID,
                                OTA_SERVICE_UUID
                            ]
                        });
                        log(`✅ Found device with battery service: ${device.name || 'Unnamed'} (${device.id})`);
                    } catch (batteryError) {
                        log(`⚠️ Battery service filter failed: ${batteryError.message}`, 'warning');
                        log('📱 Showing all devices - LOOK FOR:', 'info');
                        log('   • Device named "GRSVC1" or similar', 'info');
                        log('   • nRF52840 or Pro Micro devices', 'info');
                        log('   • Devices that were working on iPad', 'info');
                        
                        // Fallback: show all devices with better guidance
                        device = await navigator.bluetooth.requestDevice({
                            acceptAllDevices: true,
                            optionalServices: [
                                BATTERY_SERVICE_UUID,
                                ENVIRONMENTAL_SERVICE_UUID,
                                FLOW_SERVICE_UUID,
                                VALVE_SERVICE_UUID,
                                DEVICE_INFO_SERVICE_UUID,
                                OTA_SERVICE_UUID,
                                'battery_service',
                                'device_information'
                            ]
                        });
                        log(`Selected device: ${device.name || 'Unnamed'}`);
                    }
                }
                
                if (!device) {
                    throw new Error('No device selected');
                }
                
                if (device.name && device.name.includes('GRSVC')) {
                    log('✓ GRSVC device detected!', 'success');
                } else if (device.name) {
                    log(`Note: Selected "${device.name}" - not GRSVC1 but attempting connection...`, 'warning');
                } else {
                    log('Note: Device has no name - attempting connection anyway...', 'warning');
                }
                
                // Store the device reference globally
                window.device = device;
                
                // Add disconnect listener
                device.addEventListener('gattserverdisconnected', handleDisconnection);

                log(`Connecting to device: ${device.name || 'Unknown'}`);
                server = await device.gatt.connect();
                
                // Wait for connection to stabilize before service discovery
                await new Promise(resolve => setTimeout(resolve, 1500));
                
                // Connect to services
                log('Discovering services...');
                
                // Try to connect to nRF52840 services with error handling and delays
                try {
                    batteryService = await server.getPrimaryService(BATTERY_SERVICE_UUID);
                    log('✓ Connected to Battery service (0x180F)');
                    await new Promise(resolve => setTimeout(resolve, 200));
                } catch (error) {
                    log(`⚠️ Battery service not available: ${error.message}`, 'warning');
                }
                
                try {
                    environmentalService = await server.getPrimaryService(ENVIRONMENTAL_SERVICE_UUID);
                    log('✓ Connected to Environmental service (0x181A)');
                    await new Promise(resolve => setTimeout(resolve, 200));
                } catch (error) {
                    log(`⚠️ Environmental service not available: ${error.message}`, 'warning');
                }
                
                try {
                    flowService = await server.getPrimaryService(FLOW_SERVICE_UUID);
                    log('✓ Connected to Flow service (custom)');
                    await new Promise(resolve => setTimeout(resolve, 200));
                } catch (error) {
                    log(`⚠️ Flow service not available: ${error.message}`, 'warning');
                }
                
                try {
                    valveService = await server.getPrimaryService(VALVE_SERVICE_UUID);
                    log('✓ Connected to Valve service (custom)');
                    await new Promise(resolve => setTimeout(resolve, 200));
                } catch (error) {
                    log(`⚠️ Valve service not available: ${error.message}`, 'warning');
                }
                
                try {
                    deviceInfoService = await server.getPrimaryService(DEVICE_INFO_SERVICE_UUID);
                    log('✓ Connected to Device Information service (0x180A)');
                    await new Promise(resolve => setTimeout(resolve, 200));
                } catch (error) {
                    log(`⚠️ Device Information service not available: ${error.message}`, 'warning');
                }
                
                log('Getting characteristics...');
                // Get characteristics from respective services with error handling and longer delays
                if (batteryService) {
                    try {
                        batteryCharacteristic = await batteryService.getCharacteristic(BATTERY_CHARACTERISTIC_UUID);
                        log('✓ Battery characteristic available');
                        await new Promise(resolve => setTimeout(resolve, 250));
                    } catch (error) {
                        log(`⚠️ Battery characteristic failed: ${error.message}`, 'warning');
                    }
                }
                
                if (environmentalService) {
                    try {
                        temperatureCharacteristic = await environmentalService.getCharacteristic(TEMPERATURE_CHARACTERISTIC_UUID);
                        await new Promise(resolve => setTimeout(resolve, 100));
                        humidityCharacteristic = await environmentalService.getCharacteristic(HUMIDITY_CHARACTERISTIC_UUID);
                        log('✓ Temperature and humidity characteristics available');
                        await new Promise(resolve => setTimeout(resolve, 250));
                    } catch (error) {
                        log(`⚠️ Environmental characteristics failed: ${error.message}`, 'warning');
                    }
                }
                
                if (flowService) {
                    try {
                        flowCharacteristic = await flowService.getCharacteristic(FLOW_CHARACTERISTIC_UUID);
                        log('✓ Flow characteristic available');
                        await new Promise(resolve => setTimeout(resolve, 250));
                    } catch (error) {
                        log(`⚠️ Flow characteristic failed: ${error.message}`, 'warning');
                    }
                }
                
                if (valveService) {
                    try {
                        valve1Characteristic = await valveService.getCharacteristic(VALVE1_CHARACTERISTIC_UUID);
                        await new Promise(resolve => setTimeout(resolve, 100));
                        valve2Characteristic = await valveService.getCharacteristic(VALVE2_CHARACTERISTIC_UUID);
                        log('✓ Valve characteristics available');
                        await new Promise(resolve => setTimeout(resolve, 250));
                    } catch (error) {
                        log(`⚠️ Valve characteristics failed: ${error.message}`, 'warning');
                    }
                }
                
                // Get Device Information characteristics
                if (deviceInfoService) {
                    try {
                        deviceNameCharacteristic = await deviceInfoService.getCharacteristic(DEVICE_NAME_CHARACTERISTIC_UUID);
                        await new Promise(resolve => setTimeout(resolve, 100));
                        firmwareVersionCharacteristic = await deviceInfoService.getCharacteristic(FIRMWARE_VERSION_CHARACTERISTIC_UUID);
                        log('✓ Device info characteristics available');
                        await new Promise(resolve => setTimeout(resolve, 250));
                    } catch (deviceInfoError) {
                        log(`⚠️ Some device info characteristics not available: ${deviceInfoError.message}`, 'warning');
                    }
                }
                
                // Get OTA service with delay
                try {
                    await new Promise(resolve => setTimeout(resolve, 300));
                    otaService = await server.getPrimaryService(OTA_SERVICE_UUID);
                    await new Promise(resolve => setTimeout(resolve, 100));
                    otaControlCharacteristic = await otaService.getCharacteristic(OTA_CONTROL_CHARACTERISTIC_UUID);
                    await new Promise(resolve => setTimeout(resolve, 100));
                    otaDataCharacteristic = await otaService.getCharacteristic(OTA_DATA_CHARACTERISTIC_UUID);
                    log('✓ OTA service available');
                    document.getElementById('firmwareCard').style.display = 'block';
                } catch (otaError) {
                    log(`⚠️ OTA service not available: ${otaError.message}`, 'warning');
                    document.getElementById('firmwareCard').style.display = 'none';
                }

                // Final connection stabilization delay
                await new Promise(resolve => setTimeout(resolve, 500));

                updateConnectionStatus(true);
                startMonitoring();
                startConnectionCheck();
                
                // Enhanced device identification
                const deviceInfo = {
                    name: device.name || 'Unnamed',
                    id: device.id || 'Unknown ID',
                    connected: device.gatt?.connected || false
                };
                
                log('🎉 Connected successfully!', 'success');
                log(`📱 Device: ${deviceInfo.name} (${deviceInfo.id})`, 'info');
                
                // Final connection verification
                if (!device.gatt.connected) {
                    throw new Error('Connection lost after setup');
                }
                
                // Wait longer before reading device info to ensure connection is stable
                setTimeout(async () => {
                    if (window.device && window.device.gatt && window.device.gatt.connected) {
                        await readDeviceInfo();
                    }
                }, 3000);
                
                // Log available services for verification
                const serviceCount = [batteryService, environmentalService, flowService, valveService, deviceInfoService, otaService].filter(s => s).length;
                log(`📊 Available services: ${serviceCount}/6`, 'info');
                
            } catch (error) {
                log(`Connection error: ${error.message}`, 'error');
                updateConnectionStatus(false);
                window.device = null; // Clear device reference on connection failure
            }
        }

        // Disconnect
        async function disconnectFromDevice() {
            manualDisconnect = true; // Set manual disconnect flag
            
            if (window.device) {
                window.device.removeEventListener('gattserverdisconnected', handleDisconnection);
                if (window.device.gatt && window.device.gatt.connected) {
                    await window.device.gatt.disconnect();
                }
                // Clear device reference so reconnect will request device again
                window.device = null;
                server = null;
                batteryService = null;
                environmentalService = null;
                flowService = null;
                valveService = null;
                deviceInfoService = null;
                otaService = null;
                valve1Characteristic = null;
                valve2Characteristic = null;
                flowCharacteristic = null;
                batteryCharacteristic = null;
                temperatureCharacteristic = null;
                humidityCharacteristic = null;
                deviceNameCharacteristic = null;
                firmwareVersionCharacteristic = null;
                otaControlCharacteristic = null;
                otaDataCharacteristic = null;
            }
            updateConnectionStatus(false);
            log('Disconnected - click Connect to pair again');
        }

        // Scan for devices (debugging function)
        async function scanForDevices() {
            try {
                log('Scanning for BLE devices - please select any device to see what\'s available...', 'info');
                
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        'battery_service', 
                        'device_information',
                        BATTERY_SERVICE_UUID,
                        ENVIRONMENTAL_SERVICE_UUID,
                        FLOW_SERVICE_UUID,
                        VALVE_SERVICE_UUID,
                        DEVICE_INFO_SERVICE_UUID,
                        OTA_SERVICE_UUID
                    ]
                });
                
                if (device) {
                    log(`Selected device: "${device.name || 'Unnamed'}" (ID: ${device.id})`, 'info');
                    
                    if (device.name) {
                        if (device.name.includes('GRSVC') || device.name === 'GRSVC1') {
                            log('✓ This is your GRSVC1 device!', 'success');
                        } else {
                            log(`This device is named "${device.name}" - look for a device named "GRSVC1"`, 'warning');
                        }
                    } else {
                        log('This device has no name - GRSVC1 should show a name', 'warning');
                    }
                } else {
                    log('No device selected', 'warning');
                }
                
            } catch (error) {
                log(`Scan cancelled or failed: ${error.message}`, 'error');
            }
        }

        // Handle disconnection
        function handleDisconnection() {
            log('Device disconnected', 'warning');
            if (!isReconnecting && !manualDisconnect) {
                updateConnectionStatus(false);
                // Only attempt reconnection if device wasn't manually disconnected
                if (window.device !== null) {
                    attemptReconnection();
                } else {
                    log('Manual disconnect detected - click Connect to pair again', 'info');
                }
            } else if (manualDisconnect) {
                log('Manual disconnect completed', 'info');
                manualDisconnect = false; // Reset flag
            }
        }

        // Attempt to reconnect
        async function attemptReconnection() {
            if (isReconnecting || !window.device) return;
            
            isReconnecting = true;
            log('Attempting to reconnect...', 'warning');
            
            try {
                // Wait a moment before reconnecting
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Check if device is still available and try to reconnect
                if (window.device && window.device.gatt) {
                    try {
                        server = await window.device.gatt.connect();
                        batteryService = await server.getPrimaryService(BATTERY_SERVICE_UUID);
                        environmentalService = await server.getPrimaryService(ENVIRONMENTAL_SERVICE_UUID);
                        flowService = await server.getPrimaryService(FLOW_SERVICE_UUID);
                        valveService = await server.getPrimaryService(VALVE_SERVICE_UUID);
                        deviceInfoService = await server.getPrimaryService(DEVICE_INFO_SERVICE_UUID);
                        
                        batteryCharacteristic = await batteryService.getCharacteristic(BATTERY_CHARACTERISTIC_UUID);
                        temperatureCharacteristic = await environmentalService.getCharacteristic(TEMPERATURE_CHARACTERISTIC_UUID);
                        humidityCharacteristic = await environmentalService.getCharacteristic(HUMIDITY_CHARACTERISTIC_UUID);
                        flowCharacteristic = await flowService.getCharacteristic(FLOW_CHARACTERISTIC_UUID);
                        valve1Characteristic = await valveService.getCharacteristic(VALVE1_CHARACTERISTIC_UUID);
                        valve2Characteristic = await valveService.getCharacteristic(VALVE2_CHARACTERISTIC_UUID);

                        // Get device info service characteristics
                        try {
                            deviceNameCharacteristic = await deviceInfoService.getCharacteristic(DEVICE_NAME_CHARACTERISTIC_UUID);
                            firmwareVersionCharacteristic = await deviceInfoService.getCharacteristic(FIRMWARE_VERSION_CHARACTERISTIC_UUID);
                            // Read device info after reconnect
                            await readDeviceInfo();
                        } catch (error) {
                            log('Device info not fully available on reconnect', 'warning');
                        }

                        updateConnectionStatus(true);
                        startMonitoring();
                        startConnectionCheck();
                        log('Reconnected successfully!', 'info');
                    } catch (reconnectError) {
                        // If reconnection fails, device might be unpaired
                        log('Automatic reconnection failed - device may need to be paired again', 'warning');
                        log('Click Connect to pair the device again', 'info');
                        window.device = null; // Clear device reference
                        updateConnectionStatus(false);
                    }
                } else {
                    log('Device reference lost - click Connect to pair again', 'warning');
                    updateConnectionStatus(false);
                }
            } catch (error) {
                log(`Reconnection failed: ${error.message}`, 'error');
                updateConnectionStatus(false);
            } finally {
                isReconnecting = false;
            }
        }

        // Update UI
        function updateConnectionStatus(connected) {
            if (connected) {
                connectBtn.classList.add('hidden');
                disconnectBtn.classList.remove('hidden');
                statusCard.classList.remove('hidden');
                controlsCard.classList.remove('hidden');
                firmwareCard.classList.remove('hidden'); // Enable OTA support
            } else {
                connectBtn.classList.remove('hidden');
                disconnectBtn.classList.add('hidden');
                statusCard.classList.add('hidden');
                controlsCard.classList.add('hidden');
                firmwareCard.classList.add('hidden'); // Hide OTA when disconnected
                
                // Reset controls
                controlStates = { valve1: false, valve2: false };
                updateControlButton('valve1', false);
                updateControlButton('valve2', false);
                
                // Reset sensor displays
                document.getElementById('batteryLevel').textContent = '-';
                document.getElementById('temperature').textContent = '-';
                document.getElementById('humidity').textContent = '-';
                document.getElementById('flowRate').textContent = '-';
                document.getElementById('macAddress').textContent = '-';
                document.getElementById('firmwareVersion').textContent = '-';
                
                // Clear intervals
                if (monitoringInterval) {
                    clearInterval(monitoringInterval);
                    monitoringInterval = null;
                }
                if (connectionCheckInterval) {
                    clearInterval(connectionCheckInterval);
                    connectionCheckInterval = null;
                }
            }
        }

        // Start connection monitoring
        function startConnectionCheck() {
            if (connectionCheckInterval) return;
            
            connectionCheckInterval = setInterval(async () => {
                // Only check connection if we have a device reference and aren't reconnecting
                if (window.device && window.device.gatt && !window.device.gatt.connected && !isReconnecting) {
                    log('Connection lost, attempting reconnection...', 'warning');
                    handleDisconnection();
                }
            }, 5000); // Check every 5 seconds
        }

        // Refresh sensors manually
        async function refreshSensors() {
            if (!window.device || !window.device.gatt || !window.device.gatt.connected) {
                log('Not connected', 'error');
                return;
            }
            
            try {
                // Battery
                if (batteryCharacteristic) {
                    const batteryValue = await batteryCharacteristic.readValue();
                    const batteryLevel = batteryValue.getUint8(0);
                    document.getElementById('batteryLevel').textContent = `${batteryLevel}%`;
                }

                // Temperature
                if (temperatureCharacteristic) {
                    const tempValue = await temperatureCharacteristic.readValue();
                    const temperature = tempValue.getInt16(0, true) / 100;
                    document.getElementById('temperature').textContent = `${temperature.toFixed(1)}°C`;
                }

                // Humidity
                if (humidityCharacteristic) {
                    const humidityValue = await humidityCharacteristic.readValue();
                    const humidity = humidityValue.getUint16(0, true) / 100;
                    document.getElementById('humidity').textContent = `${humidity.toFixed(1)}%`;
                }

                // Flow Rate
                if (flowCharacteristic) {
                    const flowValue = await flowCharacteristic.readValue();
                    const pulseCount = flowValue.getUint32(0, true);
                    document.getElementById('flowRate').textContent = `${pulseCount} pulses`;
                }

                // Device Name
                if (deviceNameCharacteristic) {
                    const nameValue = await deviceNameCharacteristic.readValue();
                    const nameString = new TextDecoder().decode(nameValue);
                    document.getElementById('macAddress').textContent = nameString;
                }

                // Firmware Version
                if (firmwareVersionCharacteristic) {
                    const firmwareValue = await firmwareVersionCharacteristic.readValue();
                    const firmwareString = new TextDecoder().decode(firmwareValue);
                    document.getElementById('firmwareVersion').textContent = firmwareString;
                }

                log('Sensors refreshed');
            } catch (error) {
                log(`Error refreshing sensors: ${error.message}`, 'error');
                if (!isReconnecting) {
                    handleDisconnection();
                }
            }
        }

        // Toggle control
        async function toggleControl(controlId, commandPrefix) {
            if (controlId === 'valve1' && !valve1Characteristic) {
                log('Valve 1 characteristic not connected', 'error');
                return;
            }
            if (controlId === 'valve2' && !valve2Characteristic) {
                log('Valve 2 characteristic not connected', 'error');
                return;
            }

            controlStates[controlId] = !controlStates[controlId];
            const isOn = controlStates[controlId];
            
            updateControlButton(controlId, isOn);
            
            try {
                if (controlId === 'valve1') {
                    // Send binary value (0 or 1) to valve characteristic
                    const value = new Uint8Array([isOn ? 1 : 0]);
                    await valve1Characteristic.writeValue(value);
                    log(`Valve 1 ${isOn ? 'opened' : 'closed'}`);
                } else if (controlId === 'valve2') {
                    // Send binary value (0 or 1) to valve characteristic  
                    const value = new Uint8Array([isOn ? 1 : 0]);
                    await valve2Characteristic.writeValue(value);
                    log(`Valve 2 ${isOn ? 'opened' : 'closed'}`);
                }
            } catch (error) {
                log(`Error controlling ${controlId}: ${error.message}`, 'error');
                // Revert state on error
                controlStates[controlId] = !controlStates[controlId];
                updateControlButton(controlId, controlStates[controlId]);
            }
        }

        // Update button
        function updateControlButton(controlId, isOn) {
            const btn = document.getElementById(`${controlId}Btn`);
            const icon = document.getElementById(`${controlId}Icon`);
            const text = document.getElementById(`${controlId}Text`);
            
            if (isOn) {
                btn.className = 'toggle-btn on';
                text.textContent = 'ON';
                icon.textContent = '🔓';
            } else {
                btn.className = 'toggle-btn off';
                text.textContent = 'OFF';
                icon.textContent = '🔒';
            }
        }

        // File selection handler
        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) {
                selectedFile = null;
                document.getElementById('fileInfo').classList.add('hidden');
                document.getElementById('updateBtn').disabled = true;
                return;
            }

            if (!file.name.toLowerCase().endsWith('.bin')) {
                log('Please select a .bin firmware file', 'error');
                selectedFile = null;
                document.getElementById('updateBtn').disabled = true;
                return;
            }

            selectedFile = file;
            const fileInfo = document.getElementById('fileInfo');
            fileInfo.innerHTML = `
                <strong>Selected:</strong> ${file.name}<br>
                <strong>Size:</strong> ${(file.size / 1024).toFixed(1)} KB
            `;
            fileInfo.classList.remove('hidden');
            document.getElementById('updateBtn').disabled = false;
            log(`File selected: ${file.name} (${file.size} bytes)`);
        }

        // Start firmware update
        async function startFirmwareUpdate() {
            if (!selectedFile || otaInProgress) {
                return;
            }

            try {
                otaInProgress = true;
                document.getElementById('updateBtn').disabled = true;
                document.getElementById('otaProgress').classList.remove('hidden');
                
                // Stop monitoring during OTA to prevent interference
                if (monitoringInterval) {
                    clearInterval(monitoringInterval);
                    monitoringInterval = null;
                }
                if (connectionCheckInterval) {
                    clearInterval(connectionCheckInterval);
                    connectionCheckInterval = null;
                }
                
                log('Starting firmware update...');
                
                // Read file as array buffer
                const arrayBuffer = await selectedFile.arrayBuffer();
                const firmwareData = new Uint8Array(arrayBuffer);
                
                log(`Firmware size: ${firmwareData.length} bytes`);
                
                // Verify connection before starting
                if (!window.device || !window.device.gatt || !window.device.gatt.connected) {
                    throw new Error('Device not connected');
                }
                
                // Test connection stability before OTA
                log('Testing connection stability...');
                try {
                    // Test connection with multiple small operations
                    for (let i = 0; i < 3; i++) {
                        if (!window.device || !window.device.gatt || !window.device.gatt.connected) {
                            throw new Error('Connection lost during stability test');
                        }
                        await new Promise(resolve => setTimeout(resolve, 200));
                    }
                    
                    // Try a small read operation to test communication
                    if (batteryCharacteristic) {
                        await batteryCharacteristic.readValue();
                        log('Connection stability test passed');
                    }
                } catch (error) {
                    throw new Error(`Connection not stable enough for firmware update: ${error.message}`);
                }
                
                // Start OTA update - send command to ESP32
                const startCommand = new Uint8Array(5);
                startCommand[0] = 0x01; // Start OTA command
                startCommand[1] = (firmwareData.length >> 0) & 0xFF;
                startCommand[2] = (firmwareData.length >> 8) & 0xFF;
                startCommand[3] = (firmwareData.length >> 16) & 0xFF;
                startCommand[4] = (firmwareData.length >> 24) & 0xFF;
                
                await otaControlCharacteristic.writeValue(startCommand);
                log('OTA start command sent');
                
                // Wait longer for ESP32 to prepare for OTA
                log('Waiting for ESP32 to prepare...');
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                // Start with very small chunk size for OTA stability
                let currentChunkSize = 32; // Start very small for OTA
                let retryCount = 0;
                const maxRetries = 8; // More retries for OTA
                
                // Send firmware data in chunks
                let sentBytes = 0;
                let chunkIndex = 0;
                
                log(`Starting data transfer with ${currentChunkSize} byte chunks...`);
                
                while (sentBytes < firmwareData.length) {
                    // Check connection before each chunk
                    if (!window.device || !window.device.gatt || !window.device.gatt.connected) {
                        throw new Error('Connection lost during firmware update');
                    }
                    
                    const start = sentBytes;
                    const end = Math.min(start + currentChunkSize, firmwareData.length);
                    const chunk = firmwareData.slice(start, end);
                    
                    try {
                        await otaDataCharacteristic.writeValue(chunk);
                        sentBytes += chunk.length;
                        chunkIndex++;
                        retryCount = 0; // Reset retry count on success
                        
                        // Update progress
                        const progress = Math.round((sentBytes / firmwareData.length) * 100);
                        document.getElementById('progressFill').style.width = `${progress}%`;
                        document.getElementById('progressText').textContent = `${progress}%`;
                        
                        // Add delay every 5 chunks to prevent overwhelming ESP32
                        if (chunkIndex % 5 === 0) {
                            await new Promise(resolve => setTimeout(resolve, 100));
                            // Check connection health during delay
                            if (!window.device || !window.device.gatt || !window.device.gatt.connected) {
                                throw new Error('Connection lost during delay');
                            }
                            log(`Progress: ${progress}% (${sentBytes}/${firmwareData.length} bytes)`);
                        } else {
                            // Small delay between every chunk for OTA stability
                            await new Promise(resolve => setTimeout(resolve, 20));
                        }
                        
                        // Increase chunk size gradually and carefully
                        if (chunkIndex % 100 === 0 && currentChunkSize < 64) {
                            currentChunkSize = Math.min(64, currentChunkSize + 16);
                            log(`Increased chunk size to ${currentChunkSize} bytes`);
                        }
                        
                    } catch (error) {
                        retryCount++;
                        log(`Chunk ${chunkIndex} failed: ${error.message}`, 'warning');
                        
                        if (retryCount >= maxRetries) {
                            throw new Error(`Failed to send chunk after ${maxRetries} retries: ${error.message}`);
                        }
                        
                        // Reduce chunk size and add much longer delay
                        currentChunkSize = Math.max(16, Math.floor(currentChunkSize / 2));
                        log(`Reducing chunk size to ${currentChunkSize} bytes, retry ${retryCount}/${maxRetries}`, 'warning');
                        await new Promise(resolve => setTimeout(resolve, 1000)); // Longer delay for recovery
                        
                        // Don't advance sentBytes on failure - retry the same chunk
                        continue;
                    }
                }
                
                log('All firmware data sent, finishing update...');
                
                // Wait before sending finish command
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Try to send finish command, but don't fail if it doesn't work
                // (ESP32 might already be restarting)
                try {
                    // Finish OTA update
                    const finishCommand = new Uint8Array(5);
                    finishCommand[0] = 0x02; // Finish OTA command
                    finishCommand[1] = 0;
                    finishCommand[2] = 0;
                    finishCommand[3] = 0;
                    finishCommand[4] = 0;
                    
                    await otaControlCharacteristic.writeValue(finishCommand);
                    log('OTA finish command sent');
                } catch (error) {
                    // This is normal - ESP32 might already be restarting
                    log('ESP32 already restarting - this is normal after successful firmware transfer', 'info');
                }
                
                // Update progress to 100%
                document.getElementById('progressFill').style.width = '100%';
                document.getElementById('progressText').textContent = '100%';
                
                log('Firmware update completed successfully! Device will restart.', 'info');
                
                // Device will restart, so disconnect after delay
                setTimeout(() => {
                    updateConnectionStatus(false);
                    log('Device restarted with new firmware', 'info');
                    log('You can reconnect to test the new firmware', 'info');
                }, 5000);
                
            } catch (error) {
                log(`Firmware update failed: ${error.message}`, 'error');
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('progressText').textContent = '0%';
                
                // Try to restore normal operation
                if (window.device && window.device.gatt && window.device.gatt.connected) {
                    startMonitoring();
                    startConnectionCheck();
                }
            } finally {
                otaInProgress = false;
                document.getElementById('updateBtn').disabled = false;
            }
        }

        // Read device info (device name and firmware version)
        async function readDeviceInfo() {
            try {
                log('Reading device info...', 'info');
                
                // Read Device Name
                if (deviceNameCharacteristic) {
                    log('Reading device name characteristic...', 'info');
                    try {
                        const nameValue = await deviceNameCharacteristic.readValue();
                        log(`Device name value buffer length: ${nameValue.byteLength}`, 'info');
                        
                        const nameString = new TextDecoder().decode(nameValue);
                        log(`Device name: '${nameString}' (length: ${nameString.length})`, 'info');
                        
                        document.getElementById('macAddress').textContent = nameString;
                        log(`Device Name: ${nameString}`, 'info');
                    } catch (nameError) {
                        log(`Error reading device name: ${nameError.message}`, 'error');
                    }
                } else {
                    log('Device name characteristic not available', 'warning');
                }

                // Read Firmware Version
                if (firmwareVersionCharacteristic) {
                    log('Reading firmware version characteristic...', 'info');
                    try {
                        const firmwareValue = await firmwareVersionCharacteristic.readValue();
                        const firmwareString = new TextDecoder().decode(firmwareValue);
                        document.getElementById('firmwareVersion').textContent = firmwareString;
                        log(`Firmware: ${firmwareString}`, 'info');
                    } catch (firmwareError) {
                        log(`Error reading firmware version: ${firmwareError.message}`, 'error');
                    }
                } else {
                    log('Firmware version characteristic not available', 'warning');
                }
            } catch (error) {
                log(`Error reading device info: ${error.message}`, 'error');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            if ('bluetooth' in navigator) {
                log('Ready');
            } else {
                log('Bluetooth not supported', 'error');
                connectBtn.disabled = true;
                connectBtn.textContent = 'Bluetooth Not Supported';
            }
        });

        // Handle page visibility changes (background/foreground)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                // Page is hidden/minimized
                log('Page hidden - maintaining connection', 'info');
            } else {
                // Page is visible again
                if (window.device && window.device.gatt && window.device.gatt.connected) {
                    log('Page visible - connection maintained', 'info');
                } else if (window.device && !isReconnecting) {
                    log('Page visible - attempting reconnection', 'warning');
                    attemptReconnection();
                }
            }
        });

        // Handle page unload (browser closing/refreshing)
        window.addEventListener('beforeunload', (event) => {
            if (window.device && window.device.gatt && window.device.gatt.connected) {
                // Show confirmation dialog
                event.preventDefault();
                event.returnValue = 'BLE device is connected. Close anyway?';
                
                // Attempt graceful disconnect
                try {
                    window.device.gatt.disconnect();
                    log('Disconnected before page close');
                } catch (error) {
                    // Ignore errors during cleanup
                }
            }
        });

        // Handle page close
        window.addEventListener('unload', () => {
            if (window.device && window.device.gatt && window.device.gatt.connected) {
                try {
                    window.device.gatt.disconnect();
                } catch (error) {
                    // Ignore errors during cleanup
                }
            }
        });

        // Prevent page sleep on mobile (helps maintain BLE connection)
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            async function requestWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    log('Screen wake lock acquired', 'info');
                } catch (err) {
                    // Wake lock not supported or failed
                }
            }
            
            // Request wake lock when connected
            const originalUpdateStatus = updateConnectionStatus;
            updateConnectionStatus = function(connected) {
                originalUpdateStatus(connected);
                if (connected) {
                    requestWakeLock();
                } else if (wakeLock) {
                    wakeLock.release();
                    wakeLock = null;
                }
            };
        }
    </script>
