; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:pro_micro_nrf52840]
platform = https://github.com/LeeorNahum/platform-n-able-pro-micro-nrf52840.git#master
board = pro_micro_nrf52840
framework = arduino
upload_protocol = nrfutil
upload_port = COM7
monitor_port = COM8
monitor_speed = 115200

# UF2 bootloader configuration for Adafruit nRF52 Bootloader
board_build.uf2_family_id = 0xADA52840
board_upload.offset_address = 0x26000
board_upload.maximum_size = 815104

# Build flags for optimization and debugging
build_flags = 
    -DCORE_DEBUG_LEVEL=3
    -DFIRMWARE_VERSION="\"1.0.0\""
    -DDEVICE_NAME="\"GRSVC1\""
    -DCONFIG_BT_ENABLED=1

# Post-build script to generate UF2 file
extra_scripts = 
    post:scripts/post_build_uf2.py

lib_deps =
  https://github.com/h2zero/NimBLE-Arduino.git#master
  adafruit/DHT sensor library @ ^1.4.4
  adafruit/Adafruit Unified Sensor @ ^1.1.14

# Additional environment for UF2-only builds (no upload)
[env:pro_micro_nrf52840_uf2]
extends = env:pro_micro_nrf52840
upload_protocol = 
build_flags = 
    ${env:pro_micro_nrf52840.build_flags}
    -DRELEASE_BUILD=1